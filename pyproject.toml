[project]
name = "nueip-mcp"
version = "1.1.0"
description = "MCP server for NUEiP cloud HR system (personal use, simulated login)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
nueip-mcp = "nueip_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nueip_mcp"]
